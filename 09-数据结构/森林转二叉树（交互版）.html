<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>森林与二叉树的互转方法</title>
<style>
  :root{
    --bg:#ffffff; --fg:#262a33; --dim:#7e8592; --line:#e6e9ef;
    --gray:#c1c6d0; --orange:#e8a33d; --blue:#488fd8;
    --btn:#f4f6f9; --btn-h:#eaeef4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#f7f8fa}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    color:var(--fg); display:flex; justify-content:center; padding:18px 14px 28px;
  }
  .card{
    width:100%; max-width:1060px; background:var(--bg); border:1px solid var(--line);
    border-radius:14px; padding:22px 26px 18px; box-shadow:0 1px 3px rgba(20,26,40,.05);
  }
  h1{font-size:19px; margin:0 0 14px; font-weight:600; letter-spacing:.2px}
  .bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px}
  .chip{
    font-size:13px; padding:6px 13px; border-radius:999px; border:1px solid var(--line);
    background:#fff; color:var(--dim); cursor:pointer; user-select:none; transition:.18s;
  }
  .chip.on{background:#fdf3e3; border-color:#f0c98a; color:#b9762a; font-weight:600}
  .sep{width:1px; height:20px; background:var(--line); margin:0 4px}
  button{
    font:inherit; font-size:13.5px; padding:7px 16px; border-radius:9px; cursor:pointer;
    border:1px solid var(--line); background:var(--btn); color:var(--fg); transition:.15s;
  }
  button:hover:not(:disabled){background:var(--btn-h)}
  button:disabled{opacity:.4; cursor:default}
  button.primary{background:var(--orange); border-color:var(--orange); color:#fff; font-weight:600}
  button.primary:hover:not(:disabled){background:#df9a33}
  .step{margin:2px 0 6px; min-height:74px}
  .st-title{font-size:16px; font-weight:600; margin-bottom:5px}
  .st-desc{font-size:13.5px; line-height:1.75; color:var(--dim); max-width:900px}
  svg{display:block; width:100%; height:auto; margin-top:2px}
  .dots{display:flex; gap:6px; margin:8px 0 2px}
  .dot{width:7px; height:7px; border-radius:50%; background:#dfe3ea; transition:.2s}
  .dot.on{background:var(--orange); transform:scale(1.25)}
  .legend{
    display:flex; gap:26px; flex-wrap:wrap; font-size:12.5px; color:var(--dim);
    border-top:1px solid var(--line); padding-top:13px; margin-top:14px;
  }
  .legend i{display:inline-block; vertical-align:middle; margin-right:7px}
  .legend i.ln{width:22px; height:3px; border-radius:2px}
  .legend i.cir{width:15px; height:15px; border-radius:50%; border:2.4px solid var(--orange)}
  .hint{font-size:12px; color:#a6adba; margin-top:10px}
  kbd{background:#f2f4f8; border:1px solid #e2e6ed; border-bottom-width:2px; border-radius:4px;
      padding:1px 5px; font-size:11px; font-family:inherit}
</style>
</head>
<body>
<div class="card">
  <h1>森林与二叉树的互转方法</h1>

  <div class="bar">
    <span class="chip on" id="c-fwd">森林 → 二叉树</span>
    <span class="chip" id="c-rev">二叉树 → 森林</span>
    <span class="sep"></span>
    <button id="b-prev">上一步</button>
    <button id="b-next">下一步</button>
    <button id="b-play" class="primary">自动播放</button>
    <button id="b-reset">重置</button>
  </div>

  <div class="step">
    <div class="st-title" id="st-title"></div>
    <div class="st-desc" id="st-desc"></div>
  </div>

  <div class="dots" id="dots"></div>

  <svg id="cv" viewBox="0 0 1040 640" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="legend">
    <span><i class="ln" style="background:#c1c6d0"></i>父子关系</span>
    <span><i class="ln" style="background:#e8a33d"></i>左指针：第一个孩子</span>
    <span><i class="ln" style="background:#488fd8"></i>右指针：下一个兄弟</span>
    <span><i class="cir"></i>根色描边：森林中各棵树的根</span>
  </div>
  <div class="hint">快捷键：<kbd>←</kbd> <kbd>→</kbd> 切换步骤，<kbd>空格</kbd> 自动播放 / 暂停</div>
</div>

<script>
(function(){
  "use strict";

  var NODES = 'ABCDEFGHIJKL'.split('');
  var R = 24;

  var FOREST = {
    A:[200,190], B:[120,300], C:[200,300], D:[285,300],
    E:[85,410],  F:[160,410], G:[285,410],
    H:[470,190], I:[420,300], J:[535,300], K:[535,410],
    L:[700,190]
  };
  var TIDY = {
    A:[553,150],
    B:[241,250], H:[865,250],
    E:[85,350],  C:[319,350], I:[631,350], L:[943,350],
    F:[163,450], D:[475,450], J:[787,450],
    G:[397,550], K:[709,550]
  };

  var COL = { p:'#c1c6d0', l:'#e8a33d', r:'#488fd8' };
  var NODE_BD = [214,218,226], ROOT_C = [232,163,61];

  function K(u,v){ return [u,v].sort().join('-'); }
  function E(u,v,t){ return {k:K(u,v), t:t}; }

  var S0 = {pos:FOREST, roots:['A','H','L'], edges:[
    E('A','B','p'), E('A','C','p'), E('A','D','p'),
    E('B','E','p'), E('B','F','p'), E('D','G','p'),
    E('H','I','p'), E('H','J','p'), E('J','K','p')
  ]};
  var S1 = {pos:FOREST, roots:['A','H','L'], edges:[
    E('A','B','l'), E('B','C','r'), E('C','D','r'),
    E('B','E','p'), E('B','F','p'), E('D','G','p'),
    E('H','I','p'), E('H','J','p'), E('J','K','p')
  ]};
  var S2 = {pos:FOREST, roots:['A','H','L'], edges:[
    E('A','B','l'), E('B','C','r'), E('C','D','r'),
    E('B','E','l'), E('E','F','r'), E('D','G','l'),
    E('H','I','p'), E('H','J','p'), E('J','K','p')
  ]};
  var S3 = {pos:FOREST, roots:['A','H','L'], edges:[
    E('A','B','l'), E('B','C','r'), E('C','D','r'),
    E('B','E','l'), E('E','F','r'), E('D','G','l'),
    E('H','I','l'), E('I','J','r'), E('J','K','l')
  ]};
  var S4 = {pos:FOREST, roots:['A','H','L'], edges:S3.edges.concat([E('A','H','r'), E('H','L','r')])};
  var S5 = {pos:TIDY,   roots:['A'],       edges:S4.edges};

  var STATES = [S0,S1,S2,S3,S4,S5];

  var DESC = {
    fwd:[
      ['第 0 步：原始森林',
       '3 棵树，根分别是 A、H、L。A 有孩子 B、C、D，B 有 E、F，D 有 G；H 有 I、J，J 有 K；L 是单独一棵树。'],
      ['第 1 步：树 1 —— 第一个孩子作左子，其余兄弟串右链',
       'A 的第一个孩子 B 变成左子（橙）；A 的其余孩子 C、D 依次挂到前一个的右指针上（蓝），形成 B → C → D。'],
      ['第 2 步：树 1 再往下一层',
       'B 的第一个孩子 E 作左子，F 作 E 的右兄弟；D 的第一个孩子 G 作 D 的左子。'],
      ['第 3 步：树 2 同样处理',
       'H 的第一个孩子 I 作左子，J 作 I 的右兄弟；J 的第一个孩子 K 作 J 的左子。'],
      ['第 4 步：各棵树的根串成一条右链',
       '森林中每棵树的根互为兄弟，用右指针依次连起来：A → H → L。'],
      ['第 5 步：重排成标准二叉树形态',
       '这就是「左孩子右兄弟」表示法：左指针 = 第一个孩子，右指针 = 下一个兄弟；森林中各棵树的根串在最右侧的右链上。']
    ],
    rev:[
      ['第 0 步：一棵二叉树',
       '这就是「左孩子右兄弟」表示法下的二叉树，根是 A。要把它还原成森林，只要反着做。'],
      ['第 1 步：断开各棵树根之间的右链',
       'A → H → L 这条右链是森林中三棵树的根串起来的，拆开就得到 3 棵独立的树。'],
      ['第 2 步：树 2 还原',
       'H 的左子 I 变回 H 的第一个孩子，I 的右链 J 变回 I 的下一个兄弟；J 的左子 K 变回 J 的第一个孩子。'],
      ['第 3 步：树 1 下层还原',
       'B 的左子 E 变回 B 的第一个孩子，E 的右链 F 变回 E 的下一个兄弟；D 的左子 G 变回 D 的第一个孩子。'],
      ['第 4 步：树 1 上层还原',
       'B 的右链 C、D 变回 A 的孩子，A 的孩子恢复为 B、C、D。'],
      ['第 5 步：还原为原始森林',
       '三棵树各自归位，森林还原完成。反过来看一遍，转换规则就记住了。']
    ]
  };

  var ALLKEYS = (function(){
    var s = {};
    STATES.forEach(function(st){ st.edges.forEach(function(e){ s[e.k]=1; }); });
    return Object.keys(s);
  })();

  /* ---------- 可插值状态 ---------- */
  function hex2rgb(h){
    return [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  }
  function rgb2hex(c){
    return '#' + c.map(function(v){
      var x = Math.max(0, Math.min(255, Math.round(v))).toString(16);
      return x.length<2 ? '0'+x : x;
    }).join('');
  }
  function toRender(st){
    var o = {pos:{}, root:{}, edge:{}};
    NODES.forEach(function(n){
      o.pos[n] = st.pos[n].slice();
      o.root[n] = st.roots.indexOf(n) >= 0 ? 1 : 0;
    });
    ALLKEYS.forEach(function(k){
      var e = null;
      for (var i=0;i<st.edges.length;i++) if (st.edges[i].k === k) { e = st.edges[i]; break; }
      o.edge[k] = e ? {c:hex2rgb(COL[e.t]), a:1} : {c:NODE_BD.slice(), a:0};
    });
    return o;
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }

  /* ---------- 建 DOM ---------- */
  var svg = document.getElementById('cv');
  var NS = 'http://www.w3.org/2000/svg';
  var lineEl = {}, nodeEl = {};

  ALLKEYS.forEach(function(k){
    var ln = document.createElementNS(NS,'line');
    ln.setAttribute('stroke-width', 3);
    ln.setAttribute('stroke-linecap','round');
    ln.setAttribute('opacity', 0);
    svg.appendChild(ln);
    lineEl[k] = ln;
  });
  NODES.forEach(function(n){
    var g = document.createElementNS(NS,'g');
    var c = document.createElementNS(NS,'circle');
    c.setAttribute('r', R);
    c.setAttribute('fill','#fff');
    c.setAttribute('stroke-width', 2.4);
    var t = document.createElementNS(NS,'text');
    t.setAttribute('text-anchor','middle');
    t.setAttribute('dominant-baseline','central');
    t.setAttribute('font-size', 26);
    t.setAttribute('font-weight', 700);
    t.setAttribute('fill','#262a33');
    t.textContent = n;
    g.appendChild(c); g.appendChild(t);
    svg.appendChild(g);
    nodeEl[n] = {g:g, c:c};
  });

  /* ---------- 渲染 ---------- */
  var cur = null;
  function draw(){
    NODES.forEach(function(n){
      var p = cur.pos[n];
      nodeEl[n].g.setAttribute('transform','translate('+p[0]+','+p[1]+')');
      var k = cur.root[n];
      var col = [0,1,2].map(function(i){ return NODE_BD[i] + (ROOT_C[i]-NODE_BD[i])*k; });
      nodeEl[n].c.setAttribute('stroke', rgb2hex(col));
    });
    ALLKEYS.forEach(function(k){
      var e = cur.edge[k], ln = lineEl[k];
      if (e.a <= 0.01){ ln.setAttribute('opacity', 0); return; }
      var uv = k.split('-');
      ln.setAttribute('x1', cur.pos[uv[0]][0]);
      ln.setAttribute('y1', cur.pos[uv[0]][1]);
      ln.setAttribute('x2', cur.pos[uv[1]][0]);
      ln.setAttribute('y2', cur.pos[uv[1]][1]);
      ln.setAttribute('stroke', rgb2hex(e.c));
      ln.setAttribute('opacity', e.a);
    });
  }

  function lerp(a,b,t){ return a + (b-a)*t; }
  function ease(t){ return t<0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

  var raf = null;
  function animateTo(target, dur){
    if (raf) cancelAnimationFrame(raf);
    dur = dur || 520;
    var from = clone(cur), t0 = performance.now();
    function tick(now){
      var t = Math.min(1, (now-t0)/dur), e = ease(t);
      NODES.forEach(function(n){
        for (var i=0;i<2;i++) cur.pos[n][i] = lerp(from.pos[n][i], target.pos[n][i], e);
        cur.root[n] = lerp(from.root[n], target.root[n], e);
      });
      ALLKEYS.forEach(function(k){
        cur.edge[k].a = lerp(from.edge[k].a, target.edge[k].a, e);
        for (var i=0;i<3;i++)
          cur.edge[k].c[i] = lerp(from.edge[k].c[i], target.edge[k].c[i], e);
      });
      draw();
      if (t < 1) raf = requestAnimationFrame(tick);
      else { cur = target; raf = null; }
    }
    raf = requestAnimationFrame(tick);
  }

  /* ---------- 控制器 ---------- */
  var dir = 'fwd', idx = 0, playing = false, timer = null;

  function seq(){ return dir === 'fwd' ? [0,1,2,3,4,5] : [5,4,3,2,1,0]; }
  function stateOf(i){ return STATES[seq()[i]]; }

  var elTitle = document.getElementById('st-title');
  var elDesc  = document.getElementById('st-desc');
  var elDots  = document.getElementById('dots');
  var bPrev = document.getElementById('b-prev');
  var bNext = document.getElementById('b-next');
  var bPlay = document.getElementById('b-play');

  for (var i=0;i<6;i++){ var d=document.createElement('span'); d.className='dot'; elDots.appendChild(d); }

  function paint(){
    var d = DESC[dir][idx];
    elTitle.textContent = d[0];
    elDesc.textContent = d[1];
    var dots = elDots.children;
    for (var i=0;i<dots.length;i++) dots[i].className = 'dot' + (i===idx ? ' on' : '');
    bPrev.disabled = idx === 0;
    bNext.disabled = idx === 5;
  }

  function go(i, instant){
    i = Math.max(0, Math.min(5, i));
    idx = i;
    var target = toRender(stateOf(i));
    if (instant){ cur = target; draw(); } else { animateTo(target); }
    paint();
  }

  function stopPlay(){
    playing = false;
    if (timer) { clearTimeout(timer); timer = null; }
    bPlay.textContent = '自动播放';
  }

  function startPlay(){
    if (idx === 5){ go(0); }
    playing = true;
    bPlay.textContent = '暂停';
    (function loop(){
      if (!playing) return;
      if (idx >= 5){ stopPlay(); return; }
      go(idx + 1);
      timer = setTimeout(loop, 1700);
    })();
  }

  bPrev.onclick = function(){ stopPlay(); go(idx - 1); };
  bNext.onclick = function(){ stopPlay(); go(idx + 1); };
  bPlay.onclick = function(){ playing ? stopPlay() : startPlay(); };
  document.getElementById('b-reset').onclick = function(){ stopPlay(); go(0); };

  document.getElementById('c-fwd').onclick = function(){ setDir('fwd'); };
  document.getElementById('c-rev').onclick = function(){ setDir('rev'); };
  function setDir(d){
    if (d === dir) return;
    stopPlay(); dir = d;
    document.getElementById('c-fwd').className = 'chip' + (d==='fwd' ? ' on':'');
    document.getElementById('c-rev').className = 'chip' + (d==='rev' ? ' on':'');
    go(0);
  }

  document.addEventListener('keydown', function(ev){
    if (ev.key === 'ArrowLeft'){ stopPlay(); go(idx-1); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight'){ stopPlay(); go(idx+1); ev.preventDefault(); }
    else if (ev.key === ' '){ playing ? stopPlay() : startPlay(); ev.preventDefault(); }
  });

  /* ---------- 深链： #s3 / #r3 ---------- */
  function fromHash(){
    var h = (location.hash || '').replace('#','');
    var m = /^([sr])(\d)$/.exec(h);
    if (!m) return false;
    var d = m[1] === 'r' ? 'rev' : 'fwd';
    document.getElementById('c-fwd').className = 'chip' + (d==='fwd' ? ' on':'');
    document.getElementById('c-rev').className = 'chip' + (d==='rev' ? ' on':'');
    dir = d;
    go(parseInt(m[2],10), true);
    return true;
  }
  window.addEventListener('hashchange', fromHash);

  cur = toRender(stateOf(0));
  draw();
  if (!fromHash()) paint();
})();
</script>
</body>
</html>
